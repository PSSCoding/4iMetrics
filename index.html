<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporting Dashboard Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f7fb;
        --sidebar: #0f172a;
        --card-bg: #ffffff;
        --text: #0f172a;
        --muted: #6b7280;
        --accent: #2563eb;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .layout {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 240px;
        background: var(--sidebar);
        color: #fff;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .sidebar h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }

      .app-button {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
        padding: 12px 14px;
        border-radius: 10px;
        text-align: left;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s, transform 0.2s;
      }

      .app-button:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-1px);
      }

      .app-button.active {
        background: var(--accent);
        border-color: var(--accent);
      }

      .content {
        flex: 1;
        padding: 24px 28px 48px;
        overflow-y: auto;
      }

      .section {
        margin-bottom: 28px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 20px;
      }

      .kpi-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
      }

      .kpi-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        min-width: 180px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
      }

      .kpi-title {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .kpi-value {
        margin: 8px 0 4px;
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
      }

      .kpi-subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .chart-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
        margin-bottom: 12px;
        height: 320px;
      }

      .charts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 12px;
      }

      .tag-optional {
        background: rgba(37, 99, 235, 0.12);
        color: var(--accent);
        border-radius: 10px;
        padding: 2px 6px;
        font-size: 11px;
        font-weight: 700;
      }

      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }

      .section-description {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin defer></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin defer></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js" crossorigin defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
